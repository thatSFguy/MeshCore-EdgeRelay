name: Firmware Builder

on:
  workflow_call:
    inputs:
      firmware_type:
        required: true
        type: string
      release_title_prefix:
        required: true
        type: string
      prerelease:
        # publish as a pre-release instead of leaving a draft for manual review
        required: false
        type: boolean
        default: false
      release_body:
        required: false
        type: string
        default: ""
      release_tag:
        # create a release (and this tag, at the built commit) from a branch run
        required: false
        type: string
        default: ""

jobs:

  generate-build-matrix:
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.get-build-targets.outputs.targets }}
    steps:

      - name: Clone Repo
        uses: actions/checkout@v6

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build-environment

      - name: Get Build Targets
        id: get-build-targets
        run: |
          # get list of firmwares to build
          TARGET_LIST=$(/usr/bin/env bash build.sh get-${{ inputs.firmware_type }}-firmwares-to-build)
          
          # convert targets separated by new line into a json array string
          JSON_ARRAY=$(echo "$TARGET_LIST" | jq -R -s -c 'split("\n") | map(select(length > 0))')
          
          # use json array as targets result
          echo "targets=$JSON_ARRAY" >> $GITHUB_OUTPUT

  build:
    needs: generate-build-matrix
    runs-on: ubuntu-latest
    continue-on-error: true # don't fail entire build if one board fails to build
    strategy:
      matrix:
        target: ${{ fromJson(needs.generate-build-matrix.outputs.targets) }}
      fail-fast: false # don't cancel other builds if one board fails to build
    steps:

      - name: Clone Repo
        uses: actions/checkout@v6

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build-environment

      - name: Build Firmware
        env:
          FIRMWARE_VERSION: ${{ env.GIT_TAG_VERSION }}
        run: /usr/bin/env bash build.sh build-firmware ${{ matrix.target }}

      - name: Upload Workflow Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: "${{ matrix.target }}"
          path: out

  create-release:
    needs: build
    runs-on: ubuntu-latest
    # only create release for tagged builds, or when a release tag is given
    if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
    steps:

      - name: Clone Repo
        uses: actions/checkout@v6

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build-environment

      - name: Version from Release Tag
        if: inputs.release_tag != ''
        shell: bash
        run: |
          # e.g: personal-relay-v1.17.1-er-abc1234 -> v1.17.1-er-abc1234
          RELEASE_TAG="${{ inputs.release_tag }}"
          echo "GIT_TAG_VERSION=v${RELEASE_TAG#*-v}" >> $GITHUB_ENV

      - name: Download All Artifacts
        uses: actions/download-artifact@v8
        with:
          merge-multiple: true
          path: out

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          name: "${{ inputs.release_title_prefix }} ${{ env.GIT_TAG_VERSION }}"
          tag_name: ${{ inputs.release_tag || github.ref }}
          target_commitish: ${{ github.sha }}
          body: ${{ inputs.release_body }}
          draft: ${{ !inputs.prerelease }}
          prerelease: ${{ inputs.prerelease }}
          files: out/*
