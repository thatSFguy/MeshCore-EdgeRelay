; Companion (BLE) with an external serial GPS module (NEO-6M/M8N etc., 3.3V NMEA).
; The board has no onboard GPS. Wire the module's TX and RX to GPIO 15 and 13,
; either way round: at boot the board watches both and uses the one carrying
; NMEA data as the module's TX (logged on USB serial as "GPS pins: ...").
; GPS VCC -> 3V3, GND -> GND. Change GPS_PIN_A / GPS_PIN_B if wired elsewhere;
; both must be output-capable (not 34-39), since either may become the ESP32 TX.
[env:LilyGo_TLora_V2_1_1_6_companion_radio_ble_gps]
extends = LilyGo_TLora_V2_1_1_6
; not ${LilyGo_TLora_V2_1_1_6.build_flags}: that has -UENV_INCLUDE_GPS, which
; overrides -D and which build_unflags cannot remove
build_flags =
  ${esp32_base.build_flags}
  ${sensor_base.build_flags}
  ${LilyGo_TLora_V2_1_1_6.board_flags}
  -D ENV_INCLUDE_GPS=1
  -D GPS_PIN_A=15
  -D GPS_PIN_B=13
  -include variants/lilygo_tlora_v2_1/TLoraGpsPins.h
  -D PIN_USER_BTN=12         ; external push button to GND
  -D PIN_USER_BTN_PULLUP=1   ; GPIO 12 has no board pull-up (GPIO 0 does)
  -D PIN_USER_BTN_DEBOUNCE_MS=40   ; bare switch bounces; see DebouncedButton.h
  -D GPS_BAUD_RATE=9600
  -D PERSISTANT_GPS=1
  -D GPS_ENABLED_BY_DEFAULT=1   ; new installs: GPS on if a module is detected
  -I examples/companion_radio/ui-new
  -D MAX_CONTACTS=160
  -D MAX_GROUP_CHANNELS=8
  -D BLE_PIN_CODE=123456
  -D OFFLINE_QUEUE_SIZE=128
;  -D BLE_DEBUG_LOGGING=1
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
build_src_filter = ${LilyGo_TLora_V2_1_1_6.build_src_filter}
  +<helpers/esp32/*.cpp>
  +<helpers/ui/MomentaryButton.cpp>
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-new/*.cpp>
lib_deps =
  ${LilyGo_TLora_V2_1_1_6.lib_deps}
  densaugeo/base64 @ ~1.4.0

; K.I.S.S. Messenger: standalone messenger with an M5Stack CardKB keyboard
; (I2C 0x5F on GPIO 21/22, shared with the OLED), a piezo buzzer and a
; vibration motor, each switched by a 2N2222 (GPIO high = on). Chat happens on
; the device (ui-kiss); no Bluetooth. The phone app can still connect over USB.
; Do NOT flash the GPS env above to this hardware: it uses GPIO 15/13 for GPS.
;   buzzer -> GPIO 15, vibration motor -> GPIO 13, user button = BOOT (GPIO 0)
[env:LilyGo_TLora_V2_1_1_6_kiss_messenger]
extends = LilyGo_TLora_V2_1_1_6
build_flags =
  ${LilyGo_TLora_V2_1_1_6.build_flags}
  -D PIN_BUZZER=15
  -D PIN_VIBRATION=13
  -I examples/companion_radio/ui-kiss
  -D MAX_CONTACTS=160
  -D MAX_GROUP_CHANNELS=8
  -D ENABLE_USB_INTERFACE
; the queue holds messages for a phone app; the on-device UI never reads it
  -D OFFLINE_QUEUE_SIZE=8
; no environment sensors: the UI doesn't use them, and they cost flash and a boot-time I2C scan
  -D ENV_INCLUDE_AHTX0=0
  -D ENV_INCLUDE_BME280=0
  -D ENV_INCLUDE_BMP280=0
  -D ENV_INCLUDE_SHTC3=0
  -D ENV_INCLUDE_SHT4X=0
  -D ENV_INCLUDE_LPS22HB=0
  -D ENV_INCLUDE_INA3221=0
  -D ENV_INCLUDE_INA219=0
  -D ENV_INCLUDE_INA226=0
  -D ENV_INCLUDE_INA260=0
  -D ENV_INCLUDE_MLX90614=0
  -D ENV_INCLUDE_VL53L0X=0
  -D ENV_INCLUDE_BME680=0
  -D ENV_INCLUDE_BMP085=0
; NOTE: DO NOT ENABLE -->  -D MESH_PACKET_LOGGING=1
; NOTE: DO NOT ENABLE -->  -D MESH_DEBUG=1
build_src_filter = ${LilyGo_TLora_V2_1_1_6.build_src_filter}
  +<helpers/ui/MomentaryButton.cpp>
  +<helpers/ui/buzzer.cpp>
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-kiss/*.cpp>
lib_deps =
  ${LilyGo_TLora_V2_1_1_6.lib_deps}
  densaugeo/base64 @ ~1.4.0
  end2endzone/NonBlockingRTTTL@^1.3.0

